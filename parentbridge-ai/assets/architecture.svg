<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ParentBridge AI AWS CDS architecture</title>
<desc id="desc">Two-way SMS and email communications through AWS CDS, Amazon SNS, AWS Lambda, Amazon Bedrock, DynamoDB and an operator dashboard.</desc>
