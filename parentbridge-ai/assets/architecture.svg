 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1529"/><stop offset="1" stop-color="#123044"/></linearGradient>
 <linearGradient id="acc" x2="1" y2="1"><stop stop-color="#69ebc4"/><stop offset="1" stop-color="#7ac7ef"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
 <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#69e4c3"/></marker>
 <style>text{font-family:Inter,Arial,sans-serif}.title{fill:#effaff;font-weight:800;font-size:45px;letter-spacing:-1px}.sub{fill:#93aec1;font-size:20px}.kicker{fill:#6fe7cb;font-size:15px;font-weight:800;letter-spacing:2.5px}.node{fill:#182d43;stroke:#3a566d;stroke-width:2;rx:18;filter:url(#shadow)}.big{fill:#e8f9ff;font-weight:750;font-size:24px}.small{fill:#9bb8c8;font-size:17px}.mini{fill:#9bb3c5;font-size:16px}.section{fill:#91b0c2;font-size:15px;font-weight:800;letter-spacing:2px}.wire{fill:none;stroke:#69e4c3;stroke-width:4;marker-end:url(#arr)}.wire2{fill:none;stroke:#6d9eb4;stroke-width:3;stroke-dasharray:9 8;marker-end:url(#arr)}.pill{fill:#1f4a46;stroke:#388d79;stroke-width:1}.pillText{fill:#9af2ce;font-size:14px;font-weight:800}.foot{fill:#a6bccc;font-size:16px}</style>
</defs>
