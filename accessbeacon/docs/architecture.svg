<text x="145" y="227" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Browser</text><text x="145" y="257" text-anchor="middle" font-size="17" fill="#d3dfec">User dashboard</text>
<rect x="295" y="175" rx="16" width="217" height="122" fill="#1c3047" stroke="#55718f" stroke-width="2"/>
<text x="403" y="218" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">API Gateway</text><text x="403" y="247" text-anchor="middle" font-size="17" fill="#d3dfec">HTTP API</text><text x="403" y="269" text-anchor="middle" font-size="15" fill="#d3dfec">Public routes</text>
<rect x="565" y="175" rx="16" width="215" height="122" fill="#174a5d" stroke="#34c5b5" stroke-width="2"/>
<text x="672" y="219" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">AWS Lambda</text><text x="672" y="250" text-anchor="middle" font-size="17" fill="#def8f0">App handler</text><text x="672" y="271" text-anchor="middle" font-size="15" fill="#def8f0">Validation + API</text>
<rect x="830" y="175" rx="16" width="320" height="122" fill="#3c365f" stroke="#aa96ff" stroke-width="2"/>
<text x="990" y="218" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Amazon DynamoDB</text><text x="990" y="247" text-anchor="middle" font-size="17" fill="#ebe7ff">Accessibility reports</text><text x="990" y="268" text-anchor="middle" font-size="15" fill="#ebe7ff">On-demand + demo TTL</text>
<rect x="522" y="400" rx="16" width="259" height="148" fill="#263d45" stroke="#9ad18b" stroke-width="2"/>
<text x="652" y="445" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">AWS Step Functions</text><text x="652" y="475" text-anchor="middle" font-size="18" fill="#e6f8da">Orchestrate triage</text><text x="652" y="501" text-anchor="middle" font-size="15" fill="#d4e9d6">Retry + human-review fallback</text>
<rect x="50" y="400" rx="16" width="419" height="148" fill="#174a5d" stroke="#34c5b5" stroke-width="2"/>
<text x="260" y="447" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Classification Lambda</text><text x="260" y="478" text-anchor="middle" font-size="17" fill="#def8f0">Explainable impact scoring</text><text x="260" y="505" text-anchor="middle" font-size="17" fill="#def8f0">Suggested WCAG guidance</text>
<rect x="830" y="400" rx="16" width="320" height="148" fill="#174a5d" stroke="#34c5b5" stroke-width="2"/>
<text x="990" y="447" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Persistence Lambda</text><text x="990" y="479" text-anchor="middle" font-size="17" fill="#def8f0">Save classified decision</text><text x="990" y="505" text-anchor="middle" font-size="17" fill="#def8f0">or human-review state</text>
<text x="65" y="661" font-size="19" fill="#b5cbd3">Deployed with AWS SAM / CloudFormation · eu-north-1</text>
<text x="1145" y="660" text-anchor="end" font-size="18" fill="#b5cbd3">No dedicated servers or deployment pipeline</text>
