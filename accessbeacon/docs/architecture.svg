<path d="M522 474 H469"/><path d="M477 467 L468 474 L477 481"/>
<path d="M254 548 V606 H971 V303"/><path d="M964 312 L971 302 L978 312"/>
<path d="M781 474 H829"/><path d="M822 467 L830 474 L822 481"/>
</g>
