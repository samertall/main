<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc">
<title id="title">AccessBeacon AWS serverless architecture</title>
<desc id="desc">Browser connects through API Gateway to an application Lambda. Application Lambda reads and writes DynamoDB and starts a Step Functions state machine that invokes classification and persistence Lambda functions. Persistence Lambda writes classified reports into DynamoDB.</desc>
<rect width="1200" height="710" fill="#0d1727"/>
<text x="65" y="72" font-family="Arial,sans-serif" font-weight="700" font-size="38" fill="#fff">AccessBeacon</text>
<text x="65" y="115" font-family="Arial,sans-serif" font-size="22" fill="#bac9d9">AWS serverless accessibility triage architecture</text>
<g stroke="#87d7bd" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M240 236 H293"/><path d="M287 229 L295 236 L287 243"/>
